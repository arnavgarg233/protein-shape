[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-shape"
version = "0.1.0"
description = "Census of beta-sheet topology use in predicted protein structures"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "contourpy==1.2.1",
  "fonttools==4.53.1",
  "kiwisolver==1.4.5",
  "matplotlib==3.9.1",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pandas==3.0.6",
  "pillow==10.4.0",
  "pymupdf==1.26.7",
  "pyparsing==3.1.2",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
  "statsmodels==0.15.0",
]

[project.optional-dependencies]
census = [
  "foldcomp==1.0.0",
  "gemmi==0.7.5",
]
folding = [
  "gemmi==0.7.5",
]
robustness = [
  "gemmi==0.7.5",
  "tmtools==0.3.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["protein_shape*"]

[tool.setuptools.package-data]
protein_shape = ["folding/*.c"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
